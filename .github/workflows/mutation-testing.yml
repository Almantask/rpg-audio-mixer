name: Daily Mutation Testing

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  mutation-test:
    name: Run Mutation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for recent changes
        id: check_changes
        run: |
          if [ -n "$(git log --since='24 hours ago' -n 1)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java JDK
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: gradle/actions/setup-gradle@v4

      - name: Run Mutation Tests
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        run: ./gradlew app:pitestDebug

      - name: Compute Mutation Score
        id: mutation_score
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          REPORT_FILE=$(find app/build/reports/pitest -name "mutations.xml" | head -n 1)
          if [ -f "$REPORT_FILE" ]; then
            KILLED=$(grep -c "status='KILLED'" "$REPORT_FILE" || true)
            SURVIVED=$(grep -c "status='SURVIVED'" "$REPORT_FILE" || true)
            NO_COVERAGE=$(grep -c "status='NO_COVERAGE'" "$REPORT_FILE" || true)

            TOTAL=$((KILLED + SURVIVED + NO_COVERAGE))

            if [ "$TOTAL" -eq 0 ]; then
              PERCENT=0
            else
              PERCENT=$(( (KILLED * 100) / TOTAL ))
            fi

            SURVIVED_PERCENT=0
            if [ "$TOTAL" -gt 0 ]; then
              SURVIVED_PERCENT=$(( (SURVIVED * 100) / TOTAL ))
            fi

            COLOR="red"
            if [ "$SURVIVED_PERCENT" -lt 10 ]; then
              COLOR="green"
            elif [ "$SURVIVED_PERCENT" -lt 30 ]; then
              COLOR="yellow"
            fi

            echo "score=${PERCENT}%" >> $GITHUB_OUTPUT
            echo "color=${COLOR}" >> $GITHUB_OUTPUT
            echo "has_data=true" >> $GITHUB_OUTPUT
          else
            echo "mutations.xml not found."
            echo "has_data=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Mutation Score Badge via Gist
        if: (steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch') && steps.mutation_score.outputs.has_data == 'true'
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.PAT_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: mutation-score-badge.json
          label: Mutation Score
          message: ${{ steps.mutation_score.outputs.score }}
          color: ${{ steps.mutation_score.outputs.color }}

      - name: Upload Mutation Test Report
        if: always() && (steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: app/build/reports/pitest/
