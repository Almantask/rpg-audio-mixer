name: CI

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run detekt
        run: ./gradlew detekt

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          if-no-files-found: warn

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            app/build/test-results/**/*.xml

      - name: JaCoCo Coverage Report
        if: always()
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: app/build/reports/coverage/test/debug/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: Code Coverage
          update-comment: true

      - name: Upload unit test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: Upload code coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: warn

  acceptance-tests:
    name: Acceptance Tests
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup PulseAudio Dummy Driver
        run: |
          sudo apt-get install -y pulseaudio alsa-utils
          # Start pulseaudio daemon
          pulseaudio -D --exit-idle-time=-1
          # Create a dummy output sink
          pactl load-module module-null-sink sink_name=DummyOutput
          pactl set-default-sink DummyOutput

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -audio-backend pulseaudio
          disable-animations: true
          script: echo "AVD snapshot created."

      - name: Run acceptance tests and collect reports
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -audio-backend pulseaudio
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest; GRADLE_EXIT=$?
            mkdir -p app/build/reports/cucumber
            mkdir -p app/build/reports/screenshots
            adb pull /sdcard/Android/data/com.example.rpgaudiomixer/files/reports app/build/reports/cucumber || true
            adb pull /sdcard/Android/data/com.example.rpgaudiomixer/files/screenshots app/build/reports/screenshots || true
            exit $GRADLE_EXIT

      - name: Publish Acceptance Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          comment_mode: off
          files: |
            app/build/outputs/androidTest-results/connected/**/*.xml

      - name: Upload acceptance test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-report
          path: |
            app/build/reports/androidTests/
            app/build/reports/cucumber/
            app/build/reports/screenshots/
          if-no-files-found: warn

  sonar:
    name: SonarQube Analysis
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Download detekt report
        uses: actions/download-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/

      - name: Download unit test coverage report
        uses: actions/download-artifact@v4
        with:
          name: code-coverage-report
          path: app/build/reports/coverage/test/debug/

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar

      - name: Add SonarQube link to summary
        if: always()
        run: |
          echo "### SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
          echo "[View Analysis on SonarCloud](https://sonarcloud.io/project/overview?id=Almantask_rpg-audio-mixer)" >> $GITHUB_STEP_SUMMARY
