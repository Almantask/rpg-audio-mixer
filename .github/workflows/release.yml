name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Google Play
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Build and Sign App Bundle (AAB)
        run: |
          ./gradlew bundleRelease 
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore 
            -Pandroid.injected.signing.store.password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} 
            -Pandroid.injected.signing.key.alias=${{ secrets.RELEASE_KEY_ALIAS }} 
            -Pandroid.injected.signing.key.password=${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload AAB to Google Play Internal Testing Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonCode: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.rpgaudiomixer
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Securely Remove Keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore
