name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt Static Analysis
        run: ./gradlew detekt --scan

      - name: Upload Detekt Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          if-no-files-found: warn

  unit-tests:
    name: Unit Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute Unit Tests and Generate Coverage
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport --scan

      - name: Publish Test Results to PR
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            app/build/test-results/**/*.xml

      - name: Publish JaCoCo Coverage to PR
        if: always()
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: app/build/reports/coverage/test/debug/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: Code Coverage
          update-comment: true

      - name: Download Detekt Report
        if: success()
        uses: actions/download-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/

      - name: Execute SonarCloud Quality Analysis
        if: success()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --scan

      - name: Append SonarCloud Link to Job Summary
        if: always()
        run: |
          echo "### SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
          echo "[View Analysis on SonarCloud](https://sonarcloud.io/project/overview?id=Almantask_rpg-audio-mixer)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Unit Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: Upload Code Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: warn

  acceptance-tests:
    name: Acceptance Tests
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute Acceptance Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-audio -no-snapshot-save
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done; input keyevent 82'
            ./gradlew connectedDebugAndroidTest -PcucumberTags="@iter0 or @iter1"; GRADLE_EXIT=$?
            mkdir -p app/build/reports/cucumber
            mkdir -p app/build/reports/screenshots
            adb pull /sdcard/Android/data/com.example.rpgaudiomixer/files/reports app/build/reports/cucumber || true
            adb pull /sdcard/Android/data/com.example.rpgaudiomixer/files/screenshots app/build/reports/screenshots || true
            exit $GRADLE_EXIT

      - name: Publish Acceptance Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          comment_mode: off
          files: |
            app/build/outputs/androidTest-results/connected/**/*.xml

      - name: Upload Acceptance Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-report
          path: |
            app/build/reports/androidTests/
            app/build/reports/cucumber/
            app/build/reports/screenshots/
          if-no-files-found: warn
